services:
  pgdatabase:
    image: postgres:18
    container_name: pgdatabase
    environment:
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "ny_taxi"
    volumes:
      - "ny_taxi_postgres_data:/var/lib/postgresql"
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "root"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"
    depends_on:
      - pgdatabase

  ingest_zone:
    image: taxi_ingest:proyek
    depends_on:
      - pgdatabase
    command:
      - ingest_zone.py
      - --pg-host=pgdatabase

  ingest_data:
    image: taxi_ingest:proyek
    depends_on:
      - pgdatabase
    command:
      - ingest_data.py
      - --pg-host=pgdatabase

  ingest_baru:
    image: taxi_ingest:proyek
    depends_on:
      - pgdatabase
    command:
      - ingest_baru.py
      - --pg-host=pgdatabase

volumes:
  ny_taxi_postgres_data:
  pgadmin_data:
